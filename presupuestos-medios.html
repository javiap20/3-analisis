  // ── Build column HTML ──
  function buildPSColumnHtml(structure, colId, colLabel, emoji, color, shadow, headerBg, headerBorder) {
    let html = `<div class="im-wrap">
      <div style="padding:10px 16px 9px; background:${headerBg}; border-bottom:2px solid ${headerBorder}; display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.09em; color:#5a5a7a;">
        <span style="width:8px;height:8px;border-radius:50%;background:${color};box-shadow:0 0 0 2px ${shadow};flex-shrink:0;display:inline-block;"></span>
        ${emoji} ${colLabel}

      <div class="im-header-row">
        <span>Familia / Producto / Publicación</span>
        <span>Líneas ${yr !== 'all' ? yr : ''}</span>

        <span>${prevAvgLabel}</span>
        <span>% var.</span>
      </div>`;

    structure.forEach((famDef, fi) => {
      const famId = `ps-${colId}-fam-${fi}`;

      // Total real de la familia desde el Excel (independiente de los productos listados)
      // Si la familia comparte nombre entre Print y Digital, filtrar por los productos exactos de esta columna
      let famY1 = { n: 0, nPos: 0, ing: 0 }, famY0 = { n: 0, nPos: 0, ing: 0 };
      const famProdFilter = famDef.famProds ? r => r._fam === famDef.fam && famDef.famProds.includes(r._prod) : r => r._fam === famDef.fam;
      rowsY1.filter(famProdFilter).forEach(r => { const v = parseFloat(r._ingreso)||0; famY1.n++; if (v > 0) { famY1.nPos++; famY1.ing += v; } });
      rowsY0.filter(famProdFilter).forEach(r => { const v = parseFloat(r._ingreso)||0; famY0.n++; if (v > 0) { famY0.nPos++; famY0.ing += v; } });

      if (famDef.prods.length === 0) {
        // family-only row: ya calculado arriba
      }

      const famAvgY1 = avgPrice(famY1.n, famY1.nPos, famY1.ing);
      const famAvgY0 = avgPrice(famY0.n, famY0.nPos, famY0.ing);

      const prodsHtml = famDef.prods.map((pd, pi) => {
        const prodId = `ps-${colId}-prod-${fi}-${pi}`;
        const d1 = pd.multi ? getDataMulti(treeY1, pd.multi) : getData(treeY1, pd.fam, pd.prod);
        const d0 = pd.multi ? getDataMulti(treeY0, pd.multi) : getData(treeY0, pd.fam, pd.prod);
        const avgY1 = avgPrice(d1.n, d1.nPos, d1.ing);
        const avgY0 = avgPrice(d0.n, d0.nPos, d0.ing);

        // Publication rows (children of product)
        const allPubs = orderPublicationNames([...Object.keys(d1.pubs), ...Object.keys(d0.pubs)], true);
        const pubsHtml = allPubs.map(pub => {
          const p1 = d1.pubs[pub] || { n: 0, nPos: 0, ing: 0 };
          const p0 = d0.pubs[pub] || { n: 0, nPos: 0, ing: 0 };
          const pAvg1 = avgPrice(p1.n, p1.nPos, p1.ing);
          const pAvg0 = avgPrice(p0.n, p0.nPos, p0.ing);
          const hasDataY1 = zeroMode === 'con' ? p1.n > 0 : p1.nPos > 0;
          const hasDataY0 = zeroMode === 'con' ? p0.n > 0 : p0.nPos > 0;
          // líneas visibles según modo
          const pL1 = zeroMode === 'con' ? p1.n : p1.nPos;
          const pL0 = zeroMode === 'con' ? p0.n : p0.nPos;
          return `<div class="ps-pub-row">
            <div class="im-prod-name" style="padding-left:8px"><span style="width:4px;height:4px;border-radius:50%;background:#b0b0c8;flex-shrink:0;display:inline-block;"></span>${pub}</div>
            <div class="im-prod-num">${fmtNum(pL1)}</div>
            <div class="im-prod-num">${yr !== 'all' ? fmtNum(pL0) : ''}</div>
            <div>${pctBadge(pL1, pL0)}</div>
            <div class="im-separator"></div>
            <div class="im-prod-num" style="color:var(--accent);font-weight:700">${hasDataY1 ? fmt(pAvg1) : '—'}</div>
            <div class="im-prod-num">${yr !== 'all' && hasDataY0 ? fmt(pAvg0) : ''}</div>
            <div>${pctBadge(pAvg1, pAvg0)}</div>
          </div>`;
        }).join('');

        const hasD1 = zeroMode === 'con' ? d1.n > 0 : d1.nPos > 0;
        const hasD0 = zeroMode === 'con' ? d0.n > 0 : d0.nPos > 0;
        // líneas visibles a nivel producto
        const dL1 = zeroMode === 'con' ? d1.n : d1.nPos;
        const dL0 = zeroMode === 'con' ? d0.n : d0.nPos;
        return `<div class="ps-prod-block">
          <div class="ps-prod-row" onclick="toggleIM('${prodId}')">
            <div class="im-prod-name" style="font-weight:600;font-size:12px;color:var(--text2)">
              <span class="im-toggle" id="imtog-${prodId}">▶</span>
              <span class="im-fam-dot" style="background:${color}"></span>
              ${pd.label}
            </div>
            <div class="im-num">${fmtNum(dL1)}</div>
            <div class="im-num">${yr !== 'all' ? fmtNum(dL0) : ''}</div>
            <div>${pctBadge(dL1, dL0)}</div>
            <div class="im-separator"></div>
            <div class="im-num" style="color:var(--accent);font-size:13px;font-weight:700">${hasD1 ? fmt(avgY1) : '—'}</div>
            <div class="im-num">${yr !== 'all' && hasD0 ? fmt(avgY0) : ''}</div>
            <div>${pctBadge(avgY1, avgY0)}</div>
          </div>
          <div class="im-fam-children" id="${prodId}">${pubsHtml}</div>
        </div>`;
      }).join('');

      const hasFamY1 = zeroMode === 'con' ? famY1.n > 0 : famY1.nPos > 0;
      const hasFamY0 = zeroMode === 'con' ? famY0.n > 0 : famY0.nPos > 0;
      // líneas visibles a nivel familia
      const famL1 = zeroMode === 'con' ? famY1.n : famY1.nPos;
      const famL0 = zeroMode === 'con' ? famY0.n : famY0.nPos;
      html += `<div class="im-fam-block">
        <div class="im-fam-row" onclick="toggleIM('${famId}')">
          <div class="im-fam-name">
            <span class="im-toggle open" id="imtog-${famId}">▶</span>
            <span class="im-fam-dot" style="background:${color}"></span>
            ${famDef.fam}
          </div>
          <div class="im-num">${fmtNum(famL1)}</div>
          <div class="im-num">${yr !== 'all' ? fmtNum(famL0) : ''}</div>
          <div>${pctBadge(famL1, famL0)}</div>
          <div class="im-separator"></div>
          <div class="im-num" style="color:var(--accent);font-size:13px;font-weight:700">${hasFamY1 ? fmt(famAvgY1) : '—'}</div>
          <div class="im-num">${yr !== 'all' && hasFamY0 ? fmt(famAvgY0) : ''}</div>
          <div>${pctBadge(famAvgY1, famAvgY0)}</div>
        </div>
        <div class="im-fam-children open" id="${famId}">${prodsHtml}</div>
      </div>`;
    });

    html += `</div>`;
    return html;
  }

  const printHtml   = buildPSColumnHtml(PRINT_STRUCTURE,   'print',   'Productos Print',   '📰', '#2563eb', 'rgba(37,99,235,0.2)',   '#eff4ff', '#c7d9ff');
  const digitalHtml = buildPSColumnHtml(DIGITAL_STRUCTURE, 'digital', 'Productos Digitales', '🌐', '#7c3aed', 'rgba(124,58,237,0.2)', '#f5f0ff', '#ddd0ff');

  // Summary
  const totalY1 = rowsY1.length, totalY0 = rowsY0.length;
  document.getElementById('summary-bar').innerHTML = `
    <div class="summary-card accent"><div class="s-val">${PRINT_STRUCTURE.reduce((s,f)=>s+f.prods.length,0)}</div><div class="s-label">productos print</div></div>
    <div class="summary-card" style="border-top:3px solid var(--purple)"><div class="s-val">${DIGITAL_STRUCTURE.reduce((s,f)=>s+f.prods.length,0)}</div><div class="s-label">productos digitales</div></div>
    <div class="summary-card purple"><div class="s-val">${fmtNum(totalY1)}</div><div class="s-label">líneas ${yr !== 'all' ? yr : 'totales'}</div></div>`;

  const note = document.getElementById('info-note');
  note.classList.remove('hidden');
  document.getElementById('info-text').innerHTML = `<strong>Productos Seleccionados.</strong> Vista fija por familias y productos. Las columnas de precio muestran el presupuesto medio (ingreso neto ÷ líneas). Cada producto se puede plegar/desplegar para ver las publicaciones.`;

  document.getElementById('ps-container').innerHTML = `
    <div class="im-two-col">
      <div>${printHtml}</div>
      <div>${digitalHtml}</div>
    </div>`;
}

// ─── PA — PRESUPUESTO ANUAL ──────────────────────────────────────────────────
function renderPA() {
  const yr     = document.getElementById('f-year').value;
  const canal  = document.getElementById('f-canal').value;
  const sector = document.getElementById('f-sector').value;

  document.getElementById('table-wrap').style.display = 'none';
  document.getElementById('im-container').style.display = 'none';
  document.getElementById('ps-container').style.display = 'none';
  document.getElementById('pa-container').style.display = '';

  const excludedProducts = [
    'Article (Production Cost)',
    'Content Ignition',
    'COSTES FABRICACION PRODUCCION',
    'COSTES REALIZACION',
    'Gastos Ejecución (Production Cost)'
  ];

  // Sin filtro de mes — mostramos todos los meses siempre
  const rowsRaw = DATA.filter(r => {
    if (yr !== 'all' && r._year !== yr) return false;
    if (canal !== 'all' && r._canal !== canal) return false;
    if (sector !== 'all' && r._sector !== sector) return false;
    if (selectedPubs.size > 0 && !selectedPubs.has(getDashboardPub(r))) return false;
    if (excludedProducts.includes(r._prod)) return false;
    return true;
  });
  const rows = computeScopedRealRows(rowsRaw, r => r._year + '|||' + r._fam + '|||' + r._prod, true);

  // Con filtro de mes — para calcular la columna "Pres. medio" (refleja meses seleccionados)
  const rowsFilteredRaw = DATA.filter(r => {
    if (yr !== 'all' && r._year !== yr) return false;
    if (canal !== 'all' && r._canal !== canal) return false;
    if (sector !== 'all' && r._sector !== sector) return false;
    if (selectedPubs.size > 0 && !selectedPubs.has(getDashboardPub(r))) return false;
    if (excludedProducts.includes(r._prod)) return false;
    if (selectedMonths.size > 0 && !selectedMonths.has(r._mes)) return false;
    return true;
  });
  const rowsFiltered = computeScopedRealRows(rowsFilteredRaw, r => r._year + '|||' + r._fam + '|||' + r._prod, true);

  const MESES = MESES_ORDER;

  // Árbol mensual: key fam+prod → { mes: {n,nPos,ing}, pubs: { pub: { mes: {n,nPos,ing} } } }
  function buildMonthlyTree(rows) {
    const tree = {};
    rows.forEach(r => {
      const fam  = r._fam  || '(sin familia)';
      const prod = r._prod || '(sin producto)';
      const pub  = getDashboardPub(r) || '(sin publicación)';
      const ing  = parseFloat(r._ingreso) || 0;
      const mes  = r._mes  || '';
      const key  = fam + '|||' + prod;
      if (!tree[key]) tree[key] = { fam, prod, pubs: {} };
      if (!tree[key][mes]) tree[key][mes] = { n: 0, nPos: 0, ing: 0 };
      tree[key][mes].n++;
      if (ing > 0) { tree[key][mes].nPos++; tree[key][mes].ing += ing; }
      if (!tree[key].pubs[pub]) tree[key].pubs[pub] = {};
      if (!tree[key].pubs[pub][mes]) tree[key].pubs[pub][mes] = { n: 0, nPos: 0, ing: 0 };
      tree[key].pubs[pub][mes].n++;
      if (ing > 0) { tree[key].pubs[pub][mes].nPos++; tree[key].pubs[pub][mes].ing += ing; }
    });
    return tree;
  }

  const tree         = buildMonthlyTree(rows);
  const treeFiltered = buildMonthlyTree(rowsFiltered);

  function avgPriceM(d) {
    if (!d) return 0;
    if (zeroMode === 'con') return d.n    > 0 ? d.ing / d.n    : 0;
    else                    return d.nPos > 0 ? d.ing / d.nPos : 0;
  }
  function totalAvg(obj) {
    // suma todos los meses y calcula el precio medio global
    let n = 0, nPos = 0, ing = 0;
    MESES.forEach(m => { if (obj[m]) { n += obj[m].n; nPos += obj[m].nPos; ing += obj[m].ing; } });
    return avgPriceM({ n, nPos, ing });
  }

  function getData(fam, prod) { return tree[fam + '|||' + prod] || null; }
  function getDataFiltered(fam, prod) { return treeFiltered[fam + '|||' + prod] || null; }

  function getDataMultiM(pairs) {
    const result = {};
    MESES.forEach(m => result[m] = { n: 0, nPos: 0, ing: 0 });
    result.pubs = {};
    pairs.forEach(([fam, prod]) => {
      const d = getData(fam, prod);
      if (!d) return;
      MESES.forEach(m => {
        if (d[m]) { result[m].n += d[m].n; result[m].nPos += d[m].nPos; result[m].ing += d[m].ing; }
      });
      Object.entries(d.pubs).forEach(([pub, mdata]) => {
        if (!result.pubs[pub]) result.pubs[pub] = {};
        MESES.forEach(m => {
          if (!result.pubs[pub][m]) result.pubs[pub][m] = { n: 0, nPos: 0, ing: 0 };
          if (mdata[m]) { result.pubs[pub][m].n += mdata[m].n; result.pubs[pub][m].nPos += mdata[m].nPos; result.pubs[pub][m].ing += mdata[m].ing; }
        });
      });
    });
    return result;
  }

  function getDataMultiMFiltered(pairs) {
    const result = {};
    MESES.forEach(m => result[m] = { n: 0, nPos: 0, ing: 0 });
    result.pubs = {};
    pairs.forEach(([fam, prod]) => {
      const d = getDataFiltered(fam, prod);
      if (!d) return;
      MESES.forEach(m => {
        if (d[m]) { result[m].n += d[m].n; result[m].nPos += d[m].nPos; result[m].ing += d[m].ing; }
      });
      Object.entries(d.pubs).forEach(([pub, mdata]) => {
        if (!result.pubs[pub]) result.pubs[pub] = {};
        MESES.forEach(m => {
          if (!result.pubs[pub][m]) result.pubs[pub][m] = { n: 0, nPos: 0, ing: 0 };
          if (mdata[m]) { result.pubs[pub][m].n += mdata[m].n; result.pubs[pub][m].nPos += mdata[m].nPos; result.pubs[pub][m].ing += mdata[m].ing; }
        });
      });
    });
    return result;
  }

  const isActivePAMes = m => selectedMonths.size === 0 || selectedMonths.has(m);

  // grid: nombre | col-total-destacada | 12 meses
  const gridCols = `1fr 100px repeat(12, 82px)`;

  function cell(v, cls) {
    return `<div class="${cls}">${v > 0 ? fmt(v) : '<span style="color:#c8c8e0">—</span>'}</div>`;
  }
  function cellVsAvg(v, avg, cls, active) {
    const inactiveSt = active ? '' : 'style="color:#c0c0d8;background:#f8f8fb;"';
    if (v <= 0) return `<div class="${cls}" ${inactiveSt}><span style="color:#c8c8e0">—</span></div>`;
    const isBelow = active && avg > 0 && v < avg;
    return `<div class="${cls}" ${inactiveSt} ${isBelow ? 'style="color:var(--coral);font-weight:700"' : ''}>${fmt(v)}</div>`;
  }

  function buildPAColumnHtml(structure, colId, colLabel, emoji, color, shadow, headerBg, headerBorder) {

    // Fila total global del bloque — usa rowsFiltered (meses seleccionados)
    const structureFams = new Set(structure.map(f => f.fam));
    const globalMonths  = {};
    MESES.forEach(m => globalMonths[m] = { n: 0, nPos: 0, ing: 0 });
    rowsFiltered.filter(r => structureFams.has(r._fam)).forEach(r => {
      const mes = r._mes || '', ing = parseFloat(r._ingreso) || 0;
      if (!globalMonths[mes]) return;
      globalMonths[mes].n++;
      if (ing > 0) { globalMonths[mes].nPos++; globalMonths[mes].ing += ing; }
    });
    const globalTotal = totalAvg(globalMonths);
    const globalTotalCell = `<div class="pa-total-val">${globalTotal > 0 ? fmt(globalTotal) : '—'}</div>`;
    const globalMesCells  = MESES.map(m => {
      const v = avgPriceM(globalMonths[m]);
      const inactive = !isActivePAMes(m);
      return `<div class="pa-total-mes" ${inactive ? 'style="color:#7a8ab0;opacity:0.55"' : ''}>${v > 0 ? fmt(v) : '<span style="opacity:0.5">—</span>'}</div>`;
    }).join('');

    const mesHeaders = MESES.map(m => {
      const inactive = !isActivePAMes(m);
      return `<span ${inactive ? 'style="color:#aaaacc;"' : ''}>${MESES_SHORT[m]}</span>`;
    }).join('');

    let html = `<div class="im-wrap pa-block-wrap">

    structure.forEach((famDef, fi) => {
      const famId = `pa-${colId}-fam-${fi}`;

      // Datos mensuales de la familia
      const famObj = {};
      MESES.forEach(m => famObj[m] = { n: 0, nPos: 0, ing: 0 });
      const famFilter = famDef.famProds
        ? r => r._fam === famDef.fam && famDef.famProds.includes(r._prod)

      rows.filter(famFilter).forEach(r => {

        famObj[mes].n++;

      });
      // Total familia = presupuesto medio sobre meses filtrados
      const famFiltObj = {};
      MESES.forEach(m => famFiltObj[m] = { n: 0, nPos: 0, ing: 0 });
      rowsFiltered.filter(famFilter).forEach(r => {
        const mes = r._mes || '', ing = parseFloat(r._ingreso) || 0;

      const famTotalAvg  = totalAvg(famFiltObj);
      const famMesCells  = MESES.map(m => cellVsAvg(avgPriceM(famObj[m]), famTotalAvg, 'im-num', isActivePAMes(m))).join('');
      const famTotalCell = `<div class="pa-col-total fam-total">${famTotalAvg > 0 ? fmt(famTotalAvg) : '<span style="color:#c8c8e0">—</span>'}</div>`;

      const prodsHtml = famDef.prods.map((pd, pi) => {
        const prodId = `pa-${colId}-prod-${fi}-${pi}`;

        const allPubs  = d ? orderPublicationNames(Object.keys(d.pubs || {}), true) : [];
        const pubsHtml = allPubs.map(pub => {

      html += `<div class="im-fam-block">

          ${famTotalCell}

        </div>
        <div class="im-fam-children open" id="${famId}">${prodsHtml}</div>

    });

    html += `</div>`;
    return html;
  }

  const DIGITAL_STRUCTURE_PA = [

// ─── COM — PRESUPUESTO MEDIO POR COMERCIAL ────────────────────────────────────

function renderCOM() {
  const yr     = document.getElementById('f-year').value;
  const canal  = document.getElementById('f-canal').value;
  const sector = document.getElementById('f-sector').value;
  const search = document.getElementById('f-search').value.toLowerCase().trim();

  // Ocultar el resto, mostrar com-container
  document.getElementById('table-wrap').style.display   = 'none';
  document.getElementById('im-container').style.display = 'none';
  document.getElementById('ps-container').style.display = 'none';
  document.getElementById('pa-container').style.display = 'none';
  document.getElementById('com-container').style.display = '';

  // Meses seleccionados (o todos si ninguno marcado)
  const activeMeses = selectedMonths.size > 0
    ? MESES_ORDER.filter(m => selectedMonths.has(m))
    : MESES_ORDER.slice();

  const COM_EXCLUIDOS = new Set([
    'AMPARO BASTIT',
    'NORA RECIO LOPEZ TRIVIÑO',
    'NORA RECIO LOPEZ TRIVINO',
    'MARCOS MARTIN MOYANO SERRANO',
    'MADRID',
    'INTERNACIONAL',
    'BARCELONA',
    'ELENA VELAZ',
    'LUZ ROCA',
    'ANA BELÉN CRUZ',
    'ANA BELEN CRUZ',
  ].map(n => n.toUpperCase()));

  // Filtrar datos: año + canal + sector (NO filtramos por mes aquí; queremos mostrar todos los meses)
  const baseRaw = DATA.filter(r => {
    if (yr     !== 'all' && r._year   !== yr)     return false;
    if (canal  !== 'all' && r._canal  !== canal)  return false;
    if (sector !== 'all' && r._sector !== sector) return false;
    if (zeroMode === 'sin' && r._ingreso === 0)   return false;
    if (selectedPubs.size > 0 && !selectedPubs.has(getDashboardPub(r))) return false;
    // Filtro de producto (buscador)
    if (search && !r._prod.toLowerCase().includes(search)) return false;
    // Solo registros con comercial
    const com = (r[COL_COM] || '').trim();
    if (!com) return false;
    // Excluir comerciales de la lista negra
    if (COM_EXCLUIDOS.has(com.toUpperCase())) return false;
    return true;
  });
  const base = computeScopedRealRows(
    baseRaw,
    r => r._year + '|||' + r._fam + '|||' + r._prod,
    true
  );

  // Comerciales activos en el año seleccionado
  const comerciales = [...new Set(base.map(r => (r[COL_COM] || '').trim()))].filter(Boolean).sort((a, b) => a.localeCompare(b, 'es'));

  if (!comerciales.length) {
    document.getElementById('com-container').innerHTML = `<div class="empty-state" style="padding:60px;text-align:center;color:var(--text3)">Sin datos de comerciales para los filtros seleccionados</div>`;
    document.getElementById('summary-bar').innerHTML = '';
    document.getElementById('info-note').classList.add('hidden');
    return;
  }

  // ── Estructura por comercial × mes ──
  // Map: comercial → mes → { suma, lineas }
  const comData = new Map();
  comerciales.forEach(c => {
    comData.set(c, new Map());
    MESES_ORDER.forEach(m => comData.get(c).set(m, { suma: 0, lineas: 0 }));
  });

  base.forEach(r => {
    const com = (r[COL_COM] || '').trim();
    const mes = r._mes;
    if (!comData.has(com)) return;
    if (!MESES_ORDER.includes(mes)) return;
    const cell = comData.get(com).get(mes);
    cell.suma   += r._ingreso;
    cell.lineas += 1;
  });

  // ── Calcular media acumulada (solo meses activos) ──
  // Media acumulada = suma de ingresos en meses activos / nº líneas en meses activos
  function mediaAcum(com) {
    let totalSuma = 0, totalLineas = 0;
    activeMeses.forEach(m => {
      const cell = comData.get(com).get(m);
      totalSuma   += cell.suma;
      totalLineas += cell.lineas;
    });
    return totalLineas > 0 ? totalSuma / totalLineas : null;
  }

  // Calcular media mensual = suma / lineas de ese mes (solo si hay líneas)
  function mediaMes(com, mes) {
    const cell = comData.get(com).get(mes);
    return cell.lineas > 0 ? cell.suma / cell.lineas : null;
  }

  // ── Ordenar: comerciales individuales primero; ventas compartidas al final ──
  const allRows = comerciales.map(c => ({ com: c, acum: mediaAcum(c) }));
  const isVentaCompartida = c => c.split(' + ').filter(Boolean).length > 1;
  const rowsIndividuales = allRows
    .filter(r => !isVentaCompartida(r.com))
    .sort((a, b) => (b.acum || 0) - (a.acum || 0));
  const rowsCompartidas = allRows
    .filter(r => isVentaCompartida(r.com))
    .sort((a, b) => (b.acum || 0) - (a.acum || 0));
  const rows = [...rowsIndividuales, ...rowsCompartidas];

  // ── Info note ──
  const note = document.getElementById('info-note');
  note.classList.remove('hidden');
  const prodTxt = search ? ` · Producto: "<strong>${search}</strong>"` : '';
  document.getElementById('info-text').innerHTML =
    `<strong>Presupuesto medio por Comercial.</strong> Ingreso total ÷ nº líneas exactas por mes${prodTxt}. La columna <em>Media acum.</em> usa solo los meses seleccionados (marcados en azul). Los meses no seleccionados aparecen en gris. Las ventas realizadas por dos comerciales se agrupan al final bajo <strong>Ventas compartidas</strong>.`;

  // ── Summary ──
  const totalLineasAll = rows.reduce((s, row) => {
    let t = 0;
    activeMeses.forEach(m => { t += comData.get(row.com).get(m).lineas; });
    return s + t;
  }, 0);
  const totalSumaAll = rows.reduce((s, row) => {
    let t = 0;
    activeMeses.forEach(m => { t += comData.get(row.com).get(m).suma; });
    return s + t;
  }, 0);
  const avgGlobal = totalLineasAll > 0 ? totalSumaAll / totalLineasAll : 0;

  document.getElementById('summary-bar').innerHTML = `
    <div class="summary-card accent"><div class="s-val">${rows.length}</div><div class="s-label">comerciales activos</div></div>
    <div class="summary-card purple"><div class="s-val">${fmtNum(totalLineasAll)}</div><div class="s-label">líneas en período</div></div>
    <div class="summary-card green"><div class="s-val">${fmt(totalSumaAll)}</div><div class="s-label">ingreso total período</div></div>
    <div class="summary-card amber"><div class="s-val">${fmt(avgGlobal)}</div><div class="s-label">media global acumulada</div></div>`;

  // ── Meses disponibles en los datos (para no mostrar columnas vacías del año) ──
  const mesesConDatos = new Set(base.map(r => r._mes));
  const mesesMostrar  = MESES_ORDER.filter(m => mesesConDatos.has(m));

  // ── Construir tabla ──
  const isActive = m => selectedMonths.size === 0 || selectedMonths.has(m);

  // Header
  let thMeses = mesesMostrar.map(m => {
    const act = isActive(m);
    const short = MESES_SHORT[m] || m;
    return `<th class="com-th-mes ${act ? 'com-mes-act' : 'com-mes-inactive'}">${short}</th>`;
  }).join('');

  const thead = `<tr>
    <th class="left com-th-name">Comercial</th>
    <th class="com-th-acum">Media acum.</th>
    ${thMeses}
  </tr>`;

  // Rows
  let tbodyHtml = '';
  const chartDataMap = {}; // guardamos datos para dibujar luego los canvas
  const totalCols = 2 + mesesMostrar.length;
  let rowIndex = 0;

  function appendCommercialRows(rowList, shared = false) {
    rowList.forEach(({ com, acum }) => {
      const comId   = 'com-' + rowIndex++;
      const acumStr = acum !== null ? fmt(acum) : '—';

      let tdMeses = mesesMostrar.map(m => {
        const act = isActive(m);
        const med = mediaMes(com, m);
        if (!act) {
          return `<td class="com-td-mes com-mes-inactive-td">${med !== null ? fmt(med) : '<span class="com-empty">—</span>'}</td>`;
        }
        if (med === null) return `<td class="com-td-mes"><span class="com-empty">—</span></td>`;
        const cls = acum !== null ? (med > acum ? 'com-above' : med < acum ? 'com-below' : '') : '';
        return `<td class="com-td-mes ${cls}">${fmt(med)}</td>`;
      }).join('');

      // Datos para el gráfico
      chartDataMap[comId] = {
        labels: mesesMostrar.map(m => MESES_SHORT[m] || m),
        values: mesesMostrar.map(m => mediaMes(com, m)),
        acum,
        activos: mesesMostrar.map(m => isActive(m)),
      };

      tbodyHtml += `
        <tr class="com-row ${shared ? 'com-shared-row' : ''}" onclick="toggleCOMChart('${comId}', this)">
          <td class="left com-td-name">
            <span class="com-expand-btn" id="expand-${comId}">▶</span>
            ${com}
          </td>
          <td class="com-td-acum">${acumStr}</td>
          ${tdMeses}
        </tr>
        <tr class="com-chart-row" id="chart-row-${comId}" style="display:none">
          <td colspan="${totalCols}" class="com-chart-td">
            <canvas id="canvas-${comId}" class="com-canvas"></canvas>
          </td>
        </tr>`;
    });
  }

  appendCommercialRows(rowsIndividuales);
  if (rowsCompartidas.length) {
    tbodyHtml += `
      <tr class="com-shared-header">
        <td colspan="${totalCols}">
          <span class="com-shared-icon">↔</span>
          <strong>Ventas compartidas</strong>
          <span class="com-shared-count">${rowsCompartidas.length}</span>
        </td>
      </tr>`;
    appendCommercialRows(rowsCompartidas, true);
  }

  document.getElementById('com-container').innerHTML = `
    <div class="com-table-wrap">
      <table class="com-table">
        <thead>${thead}</thead>
        <tbody>${tbodyHtml || `<tr><td colspan="99" class="empty-state">Sin datos</td></tr>`}</tbody>
      </table>
    </div>`;

  // Guardamos chartDataMap en el DOM para acceder desde toggleCOMChart
  document.getElementById('com-container')._chartDataMap = chartDataMap;
}

// ─── PROD — PRESUPUESTO MEDIO POR PRODUCTO ───────────────────────────────────
function renderPROD() {
  const yr     = document.getElementById('f-year').value;
  const canal  = document.getElementById('f-canal').value;
  const sector = document.getElementById('f-sector').value;
  const search = document.getElementById('f-search').value.toLowerCase().trim();

  document.getElementById('table-wrap').style.display    = 'none';
  document.getElementById('im-container').style.display  = 'none';
  document.getElementById('ps-container').style.display  = 'none';
  document.getElementById('pa-container').style.display  = 'none';
  document.getElementById('com-container').style.display = 'none';
  document.getElementById('prod-container').style.display = '';

  const activeMeses = selectedMonths.size > 0
    ? MESES_ORDER.filter(m => selectedMonths.has(m))
    : MESES_ORDER.slice();

  const baseRaw = DATA.filter(r => {
    if (yr     !== 'all' && r._year   !== yr)     return false;
    if (canal  !== 'all' && r._canal  !== canal)  return false;
    if (sector !== 'all' && r._sector !== sector) return false;
    if (zeroMode === 'sin' && r._ingreso === 0)   return false;
    if (selectedPubs.size > 0 && !selectedPubs.has(getDashboardPub(r))) return false;
    if (search && !r._prod.toLowerCase().includes(search)) return false;
    if (!r._prod) return false;
    return true;
  });
  const base = computeScopedRealRows(
    baseRaw,
    r => r._year + '|||' + r._fam + '|||' + r._prod,
    true
  );

  const productos = [...new Set(base.map(r => r._prod))].filter(Boolean).sort((a, b) => a.localeCompare(b, 'es'));

  if (!productos.length) {
    document.getElementById('prod-container').innerHTML = `<div class="empty-state" style="padding:60px;text-align:center;color:var(--text3)">Sin datos de productos para los filtros seleccionados</div>`;
    document.getElementById('summary-bar').innerHTML = '';
    document.getElementById('info-note').classList.add('hidden');
    return;
  }

  // Map: producto → mes → { suma, lineas }
  const prodData = new Map();
  productos.forEach(p => {
    prodData.set(p, new Map());
    MESES_ORDER.forEach(m => prodData.get(p).set(m, { suma: 0, lineas: 0 }));
  });

  base.forEach(r => {
    const prod = r._prod;
    const mes  = r._mes;
    if (!prodData.has(prod) || !MESES_ORDER.includes(mes)) return;
    const cell = prodData.get(prod).get(mes);
    cell.suma   += r._ingreso;
    cell.lineas += 1;
  });

  function mediaAcumProd(prod) {
    let totalSuma = 0, totalLineas = 0;
    activeMeses.forEach(m => {
      const cell = prodData.get(prod).get(m);
      totalSuma   += cell.suma;
      totalLineas += cell.lineas;
    });
    return totalLineas > 0 ? totalSuma / totalLineas : null;
  }

  function mediaMesProd(prod, mes) {
    const cell = prodData.get(prod).get(mes);
    return cell.lineas > 0 ? cell.suma / cell.lineas : null;
  }

  const rows = productos.map(p => ({ prod: p, acum: mediaAcumProd(p) }))
                        .sort((a, b) => (b.acum || 0) - (a.acum || 0));

  // Info note
  const note = document.getElementById('info-note');
  note.classList.remove('hidden');
  const prodTxt = search ? ` · Filtro: "<strong>${search}</strong>"` : '';
  document.getElementById('info-text').innerHTML =
    `<strong>Presupuesto medio por Producto.</strong> Ingreso total ÷ nº líneas exactas por mes${prodTxt}. La columna <em>Media acum.</em> usa solo los meses seleccionados. Los meses no seleccionados aparecen en gris.`;

  // Summary
  const totalLineasAll = rows.reduce((s, row) => {
    let t = 0; activeMeses.forEach(m => { t += prodData.get(row.prod).get(m).lineas; }); return s + t;
  }, 0);
  const totalSumaAll = rows.reduce((s, row) => {
    let t = 0; activeMeses.forEach(m => { t += prodData.get(row.prod).get(m).suma; }); return s + t;
  }, 0);
  const avgGlobal = totalLineasAll > 0 ? totalSumaAll / totalLineasAll : 0;

  document.getElementById('summary-bar').innerHTML = `
    <div class="summary-card accent"><div class="s-val">${rows.length}</div><div class="s-label">productos distintos</div></div>
    <div class="summary-card purple"><div class="s-val">${fmtNum(totalLineasAll)}</div><div class="s-label">líneas en período</div></div>
    <div class="summary-card green"><div class="s-val">${fmt(totalSumaAll)}</div><div class="s-label">ingreso total período</div></div>
    <div class="summary-card amber"><div class="s-val">${fmt(avgGlobal)}</div><div class="s-label">media global acumulada</div></div>`;

  const mesesConDatos = new Set(base.map(r => r._mes));
  const mesesMostrar  = MESES_ORDER.filter(m => mesesConDatos.has(m));
  const isActive = m => selectedMonths.size === 0 || selectedMonths.has(m);

  // Header
  const thMeses = mesesMostrar.map(m => {
    const act = isActive(m);
    return `<th class="com-th-mes ${act ? 'com-mes-act' : 'com-mes-inactive'}">${MESES_SHORT[m] || m}</th>`;
  }).join('');

  const thead = `<tr>
    <th class="left com-th-name">Producto</th>
    <th class="com-th-acum">Media acum.</th>
    ${thMeses}
  </tr>`;

  // Rows
  const chartDataMapProd = {};
  let tbodyHtml = '';

  rows.forEach(({ prod, acum }, idx) => {
    const prodId  = 'prod-' + idx;
    const acumStr = acum !== null ? fmt(acum) : '—';
    const totalCols = 2 + mesesMostrar.length;

    const tdMeses = mesesMostrar.map(m => {
      const act = isActive(m);
      const med = mediaMesProd(prod, m);
      if (!act) return `<td class="com-td-mes com-mes-inactive-td">${med !== null ? fmt(med) : '<span class="com-empty">—</span>'}</td>`;
      if (med === null) return `<td class="com-td-mes"><span class="com-empty">—</span></td>`;
      const cls = acum !== null ? (med > acum ? 'com-above' : med < acum ? 'com-below' : '') : '';
      return `<td class="com-td-mes ${cls}">${fmt(med)}</td>`;
    }).join('');

    chartDataMapProd[prodId] = {
      labels:  mesesMostrar.map(m => MESES_SHORT[m] || m),
      values:  mesesMostrar.map(m => mediaMesProd(prod, m)),
      acum,
      activos: mesesMostrar.map(m => isActive(m)),
    };

    tbodyHtml += `
      <tr class="com-row" onclick="togglePRODChart('${prodId}', this)">
        <td class="left com-td-name">
          <span class="com-expand-btn" id="expand-${prodId}">▶</span>
          ${prod}
        </td>
        <td class="com-td-acum">${acumStr}</td>
        ${tdMeses}
      </tr>
      <tr class="com-chart-row" id="chart-row-${prodId}" style="display:none">
        <td colspan="${totalCols}" class="com-chart-td">
          <canvas id="canvas-${prodId}" class="com-canvas"></canvas>
        </td>
      </tr>`;
  });

  document.getElementById('prod-container').innerHTML = `
    <div class="com-table-wrap">
      <table class="com-table">
        <thead>${thead}</thead>
        <tbody>${tbodyHtml || `<tr><td colspan="99" class="empty-state">Sin datos</td></tr>`}</tbody>
      </table>
    </div>`;

  document.getElementById('prod-container')._chartDataMap = chartDataMapProd;
}

function togglePRODChart(prodId, clickedRow) {
  const chartRow = document.getElementById('chart-row-' + prodId);
  const btn      = document.getElementById('expand-' + prodId);
  if (!chartRow) return;
  const isOpen = chartRow.style.display !== 'none';
  chartRow.style.display = isOpen ? 'none' : '';
  btn.classList.toggle('com-expand-open', !isOpen);
  if (!isOpen) {
    const dataMap = document.getElementById('prod-container')._chartDataMap;
    if (dataMap && dataMap[prodId]) drawCOMChart(prodId, dataMap[prodId]);
  }
}

// ─── COM CHART EXPAND ─────────────────────────────────────────────────────────
function toggleCOMChart(comId, clickedRow) {
  const chartRow = document.getElementById('chart-row-' + comId);
  const btn      = document.getElementById('expand-' + comId);
  if (!chartRow) return;

  const isOpen = chartRow.style.display !== 'none';
  chartRow.style.display = isOpen ? 'none' : '';
  btn.classList.toggle('com-expand-open', !isOpen);

  if (!isOpen) {
    // Dibujar el gráfico
    const container = document.getElementById('com-container');
    const dataMap   = container._chartDataMap;
    if (dataMap && dataMap[comId]) drawCOMChart(comId, dataMap[comId]);
  }
}

function drawCOMChart(comId, data) {
  const canvas = document.getElementById('canvas-' + comId);
  if (!canvas) return;

  const { labels, values, acum, activos } = data;

  // Filtrar puntos con datos (null = sin datos ese mes)
  const pts = labels.map((l, i) => ({ label: l, val: values[i], active: activos[i] }));

  const W = canvas.offsetWidth || 900;
  const H = 130;
  canvas.width  = W;
  canvas.height = H;

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const PAD_L = 64, PAD_R = 20, PAD_T = 18, PAD_B = 28;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;

  // Rango Y
  const validVals = pts.map(p => p.val).filter(v => v !== null);
  if (!validVals.length) return;
  const minV = Math.min(...validVals, acum !== null ? acum : Infinity);
  const maxV = Math.max(...validVals, acum !== null ? acum : -Infinity);
  const pad  = (maxV - minV) * 0.18 || maxV * 0.2 || 1000;
  const yMin = Math.max(0, minV - pad);
  const yMax = maxV + pad;

  const xOf = i => PAD_L + (i / (pts.length - 1 || 1)) * chartW;
  const yOf = v => PAD_T + chartH - ((v - yMin) / (yMax - yMin)) * chartH;

  // ── Área rellena (línea de valores) ──
  // Construir path solo con puntos con datos
  const filled = pts.map((p, i) => ({ x: xOf(i), y: p.val !== null ? yOf(p.val) : null }));

  ctx.save();
  ctx.beginPath();
  let started = false;
  filled.forEach((p, i) => {
    if (p.y === null) return;
    if (!started) { ctx.moveTo(p.x, p.y); started = true; }
    else            ctx.lineTo(p.x, p.y);
  });
  // Cerrar área hasta la base
  const lastPt  = [...filled].reverse().find(p => p.y !== null);
  const firstPt = filled.find(p => p.y !== null);
  if (lastPt && firstPt) {
    ctx.lineTo(lastPt.x,  PAD_T + chartH);
    ctx.lineTo(firstPt.x, PAD_T + chartH);
    ctx.closePath();
  }
  const grad = ctx.createLinearGradient(0, PAD_T, 0, PAD_T + chartH);
  grad.addColorStop(0,   'rgba(37,99,235,0.28)');
  grad.addColorStop(1,   'rgba(37,99,235,0.03)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // ── Línea de valores ──
  ctx.save();
  ctx.beginPath();
  started = false;
  filled.forEach(p => {
    if (p.y === null) { started = false; return; }
    if (!started) { ctx.moveTo(p.x, p.y); started = true; }
    else            ctx.lineTo(p.x, p.y);
  });
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth   = 2.2;
  ctx.lineJoin    = 'round';
  ctx.stroke();
  ctx.restore();

  // ── Puntos sobre la línea ──
  filled.forEach((p, i) => {
    if (p.y === null) return;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle   = '#fff';
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth   = 2;
    ctx.fill();
    ctx.stroke();
  });

  // ── Línea horizontal de media acumulada ──
  if (acum !== null) {
    const yA = yOf(acum);
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([5, 4]);
    ctx.moveTo(PAD_L, yA);
    ctx.lineTo(PAD_L + chartW, yA);
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth   = 1.8;
    ctx.stroke();
    ctx.restore();
  }

  // ── Eje Y: etiquetas ──
  ctx.save();
  ctx.font        = '9px DM Sans, sans-serif';
  ctx.fillStyle   = '#9a9ab8';
  ctx.textAlign   = 'right';
  ctx.textBaseline = 'middle';
  [0, 0.5, 1].forEach(t => {
    const v = yMin + t * (yMax - yMin);
    const y = yOf(v);
    const label = v >= 1000 ? (v / 1000).toFixed(0) + 'k' : v.toFixed(0);
    ctx.fillText(label + ' €', PAD_L - 6, y);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(PAD_L, y); ctx.lineTo(PAD_L + chartW, y);
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth   = 1;
    ctx.stroke();
    ctx.restore();
  });
  ctx.restore();

  // ── Eje X: etiquetas de mes ──
  ctx.save();
  ctx.font        = '9px DM Sans, sans-serif';
  ctx.textAlign   = 'center';
  ctx.textBaseline = 'top';
  pts.forEach((p, i) => {
    ctx.fillStyle = activos[i] ? '#3a3a5c' : '#b0b0cc';
    ctx.fillText(p.label, xOf(i), PAD_T + chartH + 5);
  });
  ctx.restore();
}



// ─── PUBLICATION FILTER ───────────────────────────────────────────────────────
function buildPubDropdown() {
  // Group publications by canal
  const groups = { DIGITAL: new Set(), PRINT: new Set(), EVENTOS: new Set() };
  DATA.forEach(r => {
    const pub = getDashboardPub(r);
    if (!pub) return;
    const canal = r._canal;
    if (canal === 'DIGITAL') groups.DIGITAL.add(pub);
    else if (canal === 'PRINT') groups.PRINT.add(pub);
    else if (canal === 'EVENTOS') groups.EVENTOS.add(pub);
  });

  // Las dos publicaciones virtuales deben estar disponibles siempre en Digital.
  groups.DIGITAL.add(ELLE_GOURMET);
  groups.DIGITAL.add(ELLE_TRAVEL);

  const scroll = document.getElementById('pub-dd-scroll');
  if (!scroll) return;
  let html = '';

  const sections = [
    { key: 'DIGITAL', label: 'Digital', cls: 'digital' },
    { key: 'PRINT',   label: 'Print',   cls: 'print'   },
    { key: 'EVENTOS', label: 'Eventos', cls: 'eventos' },
  ];

  sections.forEach(({ key, label, cls }) => {
    const pubs = key === 'DIGITAL'
      ? orderPublicationNames([...groups[key]], true)
      : [...groups[key]].sort((a, b) => a.localeCompare(b, 'es'));
    if (!pubs.length) return;
    html += `<div class="pub-dd-section-title ${cls}">
      <span class="pub-dd-section-dot ${cls}"></span>${label}
    </div>`;
    pubs.forEach(pub => {
      const checked = selectedPubs.has(pub) ? 'checked' : '';
      const safePub = pub.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      html += `<div class="pub-dd-item" onclick="togglePub('${safePub}', event)">
        <input type="checkbox" id="pub-cb-${safePub}" ${checked} onclick="togglePub('${safePub}', event)">
        <span class="pub-dd-item-label">${pub}</span>
      </div>`;
    });
  });

  scroll.innerHTML = html;
  updatePubFilterBtn();
}

function togglePub(pub, e) {
  if (e) e.stopPropagation();
  if (selectedPubs.has(pub)) selectedPubs.delete(pub);
  else selectedPubs.add(pub);
  // Update checkbox visually
  const cb = document.getElementById('pub-cb-' + pub.replace(/"/g, '&quot;').replace(/'/g, '&#39;'));
  if (cb) cb.checked = selectedPubs.has(pub);
  updatePubFilterBtn();
  renderTable();
}

function clearPubFilter() {
  selectedPubs.clear();
  buildPubDropdown();
  renderTable();
}

function updatePubFilterBtn() {
  const label = document.getElementById('pub-filter-label');
  const count = document.getElementById('pub-filter-count');
  if (!label || !count) return;
  if (selectedPubs.size === 0) {
    label.textContent = 'Todas';
    count.style.display = 'none';
  } else if (selectedPubs.size === 1) {
    label.textContent = [...selectedPubs][0];
    count.style.display = 'none';
  } else {
    label.textContent = `${selectedPubs.size} publicaciones`;
    count.textContent = selectedPubs.size;
    count.style.display = '';
  }
}

function togglePubDropdown(e) {
  e.stopPropagation();
  const dd  = document.getElementById('pub-dropdown');
  const btn = document.getElementById('pub-filter-btn');
  const isOpen = dd.classList.contains('open');
  dd.classList.toggle('open', !isOpen);
  btn.classList.toggle('open', !isOpen);
}

// Close pub dropdown when clicking outside
document.addEventListener('click', e => {
  if (!e.target.closest('#pub-filter-wrap')) {
    const dd  = document.getElementById('pub-dropdown');
    const btn = document.getElementById('pub-filter-btn');
    if (dd)  dd.classList.remove('open');
    if (btn) btn.classList.remove('open');
  }
});

// ─── AUTOCOMPLETE BUSCADOR PRODUCTO ──────────────────────────────────────────
let _ddIndex = -1;

function getProductosList() {
  return [...new Set(DATA.map(r => r._prod).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
}

function onSearchInput() {
  renderTable();
  const q = document.getElementById('f-search').value.trim();
  const dd = document.getElementById('search-dropdown');
  _ddIndex = -1;

  if (q.length < 1) { dd.style.display = 'none'; return; }

  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const prods = getProductosList().filter(p => words.every(w => p.toLowerCase().includes(w)));

  if (!prods.length) {
    dd.innerHTML = `<div class="search-dd-empty">Sin coincidencias</div>`;
    dd.style.display = '';
    return;
  }

  const highlight = (str) => {
    let result = str;
    words.forEach(w => {
      const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      result = result.replace(re, '<span class="search-dd-match">$1</span>');
    });
    return result;
  };

  dd.innerHTML = prods.slice(0, 30).map(p => {
    const fam  = (DATA.find(r => r._prod === p) || {})._fam || '';
    const safe = p.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    return `<div class="search-dd-item" data-val="${p.replace(/"/g, '&quot;')}" onmousedown="selectSearchItem('${safe}')">
      <span>${highlight(p)}</span>
      ${fam ? `<span class="search-dd-fam">${fam}</span>` : ''}
    </div>`;
  }).join('');
  dd.style.display = '';
}

function selectSearchItem(val) {
  document.getElementById('f-search').value = val;
  document.getElementById('search-dropdown').style.display = 'none';
  _ddIndex = -1;
  renderTable();
}

function onSearchKey(e) {
  const dd    = document.getElementById('search-dropdown');
  const items = dd.querySelectorAll('.search-dd-item');
  if (!items.length || dd.style.display === 'none') {
    if (e.key === 'Escape') dd.style.display = 'none';
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _ddIndex = Math.min(_ddIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === _ddIndex));
    items[_ddIndex]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _ddIndex = Math.max(_ddIndex - 1, 0);
    items.forEach((el, i) => el.classList.toggle('active', i === _ddIndex));
    items[_ddIndex]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_ddIndex >= 0 && items[_ddIndex]) selectSearchItem(items[_ddIndex].dataset.val);
    else dd.style.display = 'none';
  } else if (e.key === 'Escape') {
    dd.style.display = 'none';
    _ddIndex = -1;
  }
}

document.addEventListener('click', e => {
  if (!e.target.closest('#f-search') && !e.target.closest('#search-dropdown')) {
    const dd = document.getElementById('search-dropdown');
    if (dd) dd.style.display = 'none';
    _ddIndex = -1;
  }
});

function positionTooltip(trigger, box) {
  const tr = trigger.getBoundingClientRect();
  const margin = 10;
  box.style.visibility = 'hidden'; box.style.display = 'block';
  const bh = box.offsetHeight, bw = box.offsetWidth;
  box.style.display = ''; box.style.visibility = '';
  const goBelow = tr.top < bh + margin + 20 && (window.innerHeight - tr.bottom) >= bh + margin;
  box.classList.toggle('tt-above', !goBelow);
  box.classList.toggle('tt-below', goBelow);
  let top = goBelow ? tr.bottom + 8 : tr.top - bh - 8;
  top = Math.max(margin, Math.min(top, window.innerHeight - bh - margin));
  let left = tr.left + tr.width / 2 - bw / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - bw - margin));
  box.style.top = top + 'px'; box.style.left = left + 'px';
}

function showTooltip() {}
function hideTooltip() {}

// Tooltip global: se crea una sola vez en el body y se rellena al hacer click
let _ttBox = null;
function _ensureTtBox() {
  if (_ttBox) return _ttBox;
  _ttBox = document.createElement('div');
  _ttBox.className = 'tooltip-box';
  _ttBox.id = 'global-tt-box';
  document.body.appendChild(_ttBox);
  return _ttBox;
}

function toggleTooltip(e, trigger) {
  e.stopPropagation();
  const box = _ensureTtBox();
  const isOpen = box.classList.contains('tt-visible') && box._trigger === trigger;
  // Cerrar si ya estaba abierto con este trigger
  if (isOpen) { box.classList.remove('tt-visible'); box._trigger = null; return; }

  // Leer datos del trigger
  const areas   = JSON.parse(trigger.dataset.areas   || '[]');
  const sectors = JSON.parse(trigger.dataset.sectors || '[]');
  const pubs    = JSON.parse(trigger.dataset.pubs    || '[]');
  const refLabel = trigger.dataset.reflabel || '';
  const refVal   = trigger.dataset.refval   || '';
  const curVal   = parseFloat(trigger.dataset.curval) || 0;

  const rowHtml = (arr) => arr.length
    ? arr.map(s => {
        const cls = s.avg > curVal ? 'tt-above' : s.avg < curVal ? 'tt-below' : 'tt-equal';
        return `<div class="tt-row"><span class="tt-area">${s.area}</span><span class="tt-val ${cls}">${fmt(s.avg)}</span></div>`;
      }).join('')
    : `<div class="tt-row"><span class="tt-area" style="font-style:italic">Sin datos</span></div>`;

  box.innerHTML = `
    <div class="tt-cols">
      <div>
        <div class="tt-title">Precio medio por área</div>
        ${rowHtml(areas)}
        <div class="tt-avg-line">${refLabel} <span>${refVal}</span></div>
      </div>
      <div style="border-left:1px solid rgba(255,255,255,0.08);padding-left:16px">
        <div class="tt-title">Precio medio por sector</div>
        ${rowHtml(sectors)}
        <div class="tt-avg-line">${refLabel} <span>${refVal}</span></div>
      </div>
      <div style="border-left:1px solid rgba(255,255,255,0.08);padding-left:16px">
        <div class="tt-title">Precio medio por publicación</div>
        ${rowHtml(pubs)}
        <div class="tt-avg-line">${refLabel} <span>${refVal}</span></div>
      </div>
    </div>`;

  box._trigger = trigger;
  positionTooltip(trigger, box);
  box.classList.add('tt-visible');
  _openTooltip = 'global-tt-box';
}

function closeTipsOutside(e) {
  if (!_ttBox) return;
  if (_openTooltip && !e.target.closest('.tt-trigger') && !e.target.closest('#global-tt-box')) {
    _ttBox.classList.remove('tt-visible');
    _ttBox._trigger = null;
    _openTooltip = null;
  }
}

// ─── SECTOR EXPAND ────────────────────────────────────────────────────────────
function toggleSector(rowId) {
  const sectorRow = document.getElementById('sector-' + rowId);
  const btn = document.getElementById('btn-' + rowId);
  if (!sectorRow) return;
  const isOpen = sectorRow.style.display !== 'none';
  sectorRow.style.display = isOpen ? 'none' : '';
  btn?.classList.toggle('open', !isOpen);
}
